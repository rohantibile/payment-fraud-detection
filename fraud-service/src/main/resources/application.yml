server:
  port: 8082

spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:mysql://localhost:3306/frauddb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.rohan.fraud.dto.PaymentEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.rohan.fraud.dto